name: Integration

# Runs the integration suites against the public `surreal` release named in
# .github/surreal-version, which must serve the `pgsql` and `mysql` RPC methods (4.0.0 and later).
# Bump that file to move to a newer release.
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    server:
        name: Server Integration
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Resolve the release
              id: release
              run: |
                  version="$(tr -d '[:space:]' < .github/surreal-version)"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  url="https://github.com/surrealdb/surrealdb/releases/download/v${version}/surreal-v${version}.linux-amd64.tgz"
                  echo "url=$url" >> "$GITHUB_OUTPUT"

            - name: Install Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4

            - name: Install Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Download the server
              run: |
                  mkdir -p "$RUNNER_TEMP/surreal-bin"
                  curl -fsSL "${{ steps.release.outputs.url }}" | tar -xz -C "$RUNNER_TEMP/surreal-bin"
                  chmod +x "$RUNNER_TEMP/surreal-bin/surreal"
                  "$RUNNER_TEMP/surreal-bin/surreal" version

            - name: Integration tests
              run: bun run test:integration
              env:
                  SURREAL_BIN: ${{ runner.temp }}/surreal-bin/surreal
